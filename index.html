  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]}</svg>`;
}

const episodes = {
  pilot:['长夜既明先导片','世家公子和侍卫的故事。','11','1:36','2026-10-18','pilot'],
  e01:['脏脏包和奶团子的故事开始了【长夜既明 01】','故事从一次意外相遇开始。','5','2:51','2026-10-19','first'],
  e18:['少爷为什么要这样？【长夜既明 18 · 念念不可说】','若能毫无顾忌，少爷又会怎样选择？','10','3:05','2026-11-15','e18'],
  e19:['少爷不懂，但是少爷主动【长夜既明 19 · 一念叩心】','暮色四合，一场对峙刚刚开始。','14','3:22','2026-11-16','e19'],
  e20:['睡了！【长夜既明 20 · 冬日暖情】','少爷至少像这样未按时就寝。','122','3:14','2026-11-18','e20'],
  e21:['好像有什么不得了的大事发生？【长夜既明 21 · 暗流】','山雨欲来，暗流已至。','250','4:48','2026-11-20','e21'],
  e22:['我上春山，等你来见～【长夜既明 22 · 上春山】','一路向着春山而去。','53','3:48','2026-11-22','latest'],
  q01:['初见【青梅竹马 01】','少年时的第一次相遇。','13','2:00','2026-11-01','pilot'],
  q02:['约好一起回家【青梅竹马 02】','门口有人还在等你。','27','2:25','2026-11-03','e20'],
  q03:['从前的约定【青梅竹马 03】','循着旧路，想起从前的约定。','31','3:14','2026-11-06','e18']
};
const collections = {
  night:{name:'长夜既明', author:'山药葛根玉米粉', cover:'cover', poster:'hero', initial:'e21', ids:['pilot','e01','e18','e19','e20','e21','e22'], edits:[['e19','pilot','e22','e01','e21','e20','e18'],['e21','e20','pilot','e18','e22','e01','e19']], metrics:[14,522,315], tags:['视频星推计划','年上','青梅竹马','长夜既明']},
  plum:{name:'青梅竹马', author:'山药葛根玉米粉', cover:'e20', initial:'q01', ids:['q01','q02','q03'], edits:[['q02','q01','q03'],['q03','q01','q02']], metrics:[8,71,103], tags:['视频星推计划','青梅竹马','原创短剧']}
};
const state = {collection:'night', page:'sheet', view:'card', fromAll:false, now:'e21', elapsed:0, playing:false};
const orderLabels = {forward:'正序', reverse:'倒序'};
const previewSeconds = 8;
const preferences = {};
const storagePrefix = 'collection-sort-demo.v1.';
const screen = document.querySelector('#screen');
const controls = document.querySelector('#control-panel');
const label = document.querySelector('#screen-label');
const toast = document.querySelector('#toast');
let toastTimer;

function saved() {
  const id = state.collection;
  if (preferences[id]) return preferences[id];
  const value = {order:'forward', edit:0, subscribed:true};
  try {
    const previous = JSON.parse(localStorage.getItem(storagePrefix + id));
    if (['reverse', 'desc'].includes(previous?.order)) value.order = 'reverse';
    if ([1, 2].includes(previous?.edit)) value.edit = previous.edit;
    if (previous?.subscribed === false) value.subscribed = false;
  } catch { /* The current session still works when browser storage is unavailable. */ }
  preferences[id] = value;
  return value;
}
function persist() {
  try { localStorage.setItem(storagePrefix + state.collection, JSON.stringify(saved())); } catch {}
}
function collection() { return collections[state.collection]; }
function forwardIds() {
  const {edit} = saved();
  return edit ? [...collection().edits[edit - 1]] : [...collection().ids].sort((left, right) => episodes[left][4].localeCompare(episodes[right][4]));
}
function sortedIds() {
  const ids = forwardIds();
  return saved().order === 'reverse' ? ids.reverse() : ids;
}
function nextEpisode() {
  const ids = forwardIds();
  const index = ids.indexOf(state.now);
  return index >= 0 ? ids[index + 1] ?? null : null;
}
function image(key, alt = '') { return `<img src="${artwork[key]}" alt="${alt}" draggable="false">`; }
function button(action, labelText, iconName, className = 'icon') {
  return `<button type="button" class="${className}" data-action="${action}" aria-label="${labelText}" title="${labelText}">${icon(iconName)}</button>`;
}
function sortingButton() {
  const {order} = saved();
  const forward = order === 'forward';
  const opposite = forward ? 'reverse' : 'forward';
  return `<button type="button" class="sort" data-action="sort" aria-label="当前${orderLabels[order]}，切换为${orderLabels[opposite]}">${icon(forward ? 'desc' : 'asc')}<span>${orderLabels[order]}</span></button>`;
}
function thumbnail(key, duration = '', bakedPlay = false) {
  return `<span class="thumb">${image(key)}${bakedPlay ? '' : `<span class="triangle">${icon('play')}</span>`}${duration ? `<span class="duration">${duration}</span>` : ''}</span>`;
}
function episodeRow(id, mode) {
  const [title, summary, heat, duration,, art] = episodes[id];
  const isCurrent = state.now === id;
  const body = mode === 'card'
    ? `<span class="byline">${image(collection().cover)}<strong>${collection().author}</strong></span><strong class="card-title">${title}</strong>${thumbnail(art, duration, true)}<small class="card-meta">${heat} 热度</small>`
    : `<span class="item-text"><strong>${title}</strong>${mode === 'list' ? `<span class="summary">${summary}</span>` : ''}<small>${mode === 'sheet' ? `${duration}　` : ''}${heat} 热度</small></span>`;
  return `<button type="button" class="episode" data-action="episode" data-id="${id}"${isCurrent ? ' aria-current="true"' : ''}>${mode === 'sheet' ? thumbnail(art, '', true) : ''}${body}${mode === 'list' ? thumbnail(art, '', true) : ''}</button>`;
}
function subscription() {
  const subscribed = saved().subscribed;
  return `<button type="button" class="pill subscription" data-action="subscribe" aria-pressed="${subscribed}">${subscribed ? '已订阅' : '订阅合集'}${state.page === 'sheet' && subscribed ? '<small>若有更新，将在「订阅 · 合集」中展示</small>' : ''}</button>`;
}
function renderReader(ids) {
  const current = collection();
  const [title,,,,, art] = episodes[state.now];
  const poster = state.now === current.initial && current.poster ? current.poster : art;
  const showingSheet = state.page === 'sheet';
  return `<section class="reader${state.playing ? ' playing' : ''}" aria-label="视频页">
    <div class="reader-cover"><div class="poster${poster === 'hero' ? ' wide' : ''}">${image(poster, '视频封面')}</div>
      <div class="reader-top">${state.fromAll ? button('reader-back', '返回合集详情页', 'back') : ''}</div>
      <div class="cover-caption"><div><small>${current.name}</small><strong>${title}</strong></div>${button('play', state.playing ? '暂停预览' : '播放预览', state.playing ? 'pause' : 'play', 'play-btn')}</div>
      <div class="progress" aria-hidden="true"><span></span></div>
    </div>
    ${showingSheet ? `<section class="sheet" aria-label="视频播放弹窗页">
      <div class="sheet-head"><div class="sheet-title">${icon('layers')}<span>合集 · ${current.name}</span><small>${ids.length} 个视频</small></div>${sortingButton()}${button('close', '关闭合集弹窗', 'close', 'icon close')}</div>
      <div class="sheet-list" data-scroll>${ids.map(id => episodeRow(id, 'sheet')).join('')}</div>
      <div class="sheet-footer"><button type="button" class="pill secondary" data-action="all">查看全部</button>${subscription()}</div>
    </section>` : `<button type="button" class="pill reopen" data-action="sheet">${icon('layers')}合集 · ${current.name}　${ids.length} 个视频</button>`}
  </section>`;
}
function renderAll(ids) {
  const current = collection();
  const card = state.view === 'card';
  return `<section class="full" aria-label="合集详情页">
    <header class="full-head"><div class="head-bg" aria-hidden="true">${image(current.cover)}</div><div class="full-nav">${button('sheet', '返回视频播放弹窗', 'back')}<span>合集</span></div>
      <div class="collection"><div class="thumb">${image(current.cover)}</div><div><h2>${current.name}</h2><p>${current.author} · 更新于昨天<br><span>视频合集</span><span>近期有更新</span></p></div></div>
      <div class="metrics">${current.metrics.map((metric, i) => `<div><strong>${metric}</strong><small>${['订阅数','总热度','浏览数'][i]}</small></div>`).join('')}</div>
    </header>
    <div class="full-body"><div class="tags">${current.tags.map(tag => `<span># ${tag}</span>`).join('')}</div>
      <div class="toolbar">${sortingButton()}<span>${ids.length} 个视频</span>${button('view', card ? '切换到列表视图' : '切换到卡片视图', card ? 'list' : 'card')}</div>
      <div class="full-scroll ${state.view}-view" data-scroll aria-label="${card ? '卡片视图' : '列表视图'}">${ids.map(id => episodeRow(id, state.view)).join('')}</div>
    </div>
    <div class="full-footer">${subscription()}<button type="button" class="pill read" data-action="read">开始阅读</button></div>
  </section>`;
}
function renderControls() {
  const {order, edit} = saved();
  const page = state.page === 'all' ? state.view : state.page;
  const next = nextEpisode();
  const nextTitle = next ? episodes[next][0] : '已无下一集';
  const routes = [['sheet','layers','视频播放弹窗页'],['card','card','合集详情 · 卡片视图'],['list','list','合集详情 · 列表视图']];
  controls.innerHTML = `
    <section class="panel"><h2>页面预览</h2><div class="segments">${routes.map(([route, glyph, text]) => `<button type="button" data-action="preview" data-id="${route}" aria-pressed="${page === route}">${icon(glyph)}${text}${page === route ? '<span class="current-dot" aria-hidden="true"></span>' : ''}</button>`).join('')}</div></section>
    <section class="panel"><h2>演示场景</h2><div class="collection-options">${Object.entries(collections).map(([id, item]) => `<button type="button" data-action="collection" data-id="${id}" aria-pressed="${state.collection === id}">${image(item.cover)}${item.name}</button>`).join('')}</div>
      <div class="scenarios"><button type="button" class="finish" data-action="finish"${state.page === 'all' ? ' disabled' : ''}>${icon('play')}模拟完播</button>
      <button type="button" data-action="edit">${icon('shuffle')}模拟作者改序</button>
      <button type="button" data-action="restore"${edit ? '' : ' disabled'}>${icon('reset')}恢复发布时间顺序</button>
      <button type="button" data-action="forget">${icon('reset')}清除当前合集的排序记录</button></div></section>
    <section class="panel"><h2>排序与续播</h2><dl class="state"><div><dt>当前排序</dt><dd class="order-value">${orderLabels[order]}</dd></div><div><dt>合集基准</dt><dd>${edit ? `作者调整顺序 · 方案 ${edit}` : '发布时间顺序'}</dd></div><div><dt>下一集</dt><dd class="next-title" title="${nextTitle}">${nextTitle}</dd></div></dl><p class="rule">${edit ? '正序按作者最新顺序展示，倒序将该顺序反转。' : '正序由远到近，倒序由近到远。'}完播后播放正序队列中的下一集。</p></section>`;
}
function render({keepScroll = false, revealEpisode = false, trigger} = {}) {
  const scroll = keepScroll ? screen.querySelector('[data-scroll]')?.scrollTop : 0;
  const focused = trigger === document.activeElement;
  const ids = sortedIds();
  const full = state.page === 'all';
  screen.innerHTML = full ? renderAll(ids) : renderReader(ids);
  label.textContent = full ? `合集详情 · ${state.view === 'card' ? '卡片' : '列表'}视图` : state.page === 'sheet' ? '视频播放弹窗页' : '视频播放页';
  if (scroll) screen.querySelector('[data-scroll]').scrollTop = scroll;
  if (revealEpisode) revealPlayingEpisode();
  updateProgress();
  renderControls();
  if (focused && trigger) {
    const action = trigger.dataset.action;
    const id = trigger.dataset.id;
    const same = [...document.querySelectorAll(`[data-action="${action}"]`)].find(el => el.dataset.id === id && !el.disabled && el.getClientRects().length);
    const next = screen.querySelector('[data-action="sort"], [data-action="sheet"], [data-action="play"]');
    (same || next)?.focus({preventScroll:true});
  }
}
function revealPlayingEpisode() {
  const list = screen.querySelector('.sheet-list, .list-view');
  const row = list?.querySelector('[aria-current="true"]');
  if (!row) return;
  const rowBounds = row.getBoundingClientRect();
  const visibleTop = list.getBoundingClientRect().top + list.clientTop;
  const visibleBottom = visibleTop + list.clientHeight;
  if (rowBounds.top < visibleTop) {
    list.scrollTop -= Math.ceil(visibleTop - rowBounds.top);
  } else if (rowBounds.bottom > visibleBottom) {
    list.scrollTop += Math.ceil(rowBounds.bottom - visibleBottom);
  }
}
function updateProgress() {
  screen.querySelector('.progress span')?.style.setProperty('--progress', `${Math.min(100, state.elapsed / previewSeconds * 100)}%`);
}
function notify(message, isSorting = false) {
  clearTimeout(toastTimer);
  toast.classList.toggle('sort-toast', isSorting);
  toast.textContent = message;
  toast.hidden = false;
  toastTimer = setTimeout(() => { toast.hidden = true; }, 2200);
}
function openPage(page) {
  if (page === 'all' || state.page === 'all') state.fromAll = false;
  state.page = page;
  if (page === 'all') state.playing = false;
}
function playEpisode(id) {
  const returnToAll = state.page === 'all';
  if (state.now !== id || state.elapsed >= previewSeconds) state.elapsed = 0;
  state.now = id;
  state.playing = true;
  if (returnToAll) {
    state.page = 'sheet';
    state.fromAll = true;
  }
}
function finishEpisode(trigger) {
  const next = nextEpisode();
  if (next) {
    playEpisode(next);
  } else {
    state.elapsed = previewSeconds;
    state.playing = false;
  }
  render({keepScroll:true, revealEpisode:Boolean(next), trigger});
  notify(next ? '已自动播放下一集' : '已无下一集');
}
document.addEventListener('click', event => {
  const trigger = event.target.closest('button[data-action]');
  if (!trigger) return;
  const {action, id} = trigger.dataset;
  const pref = saved();
  let message = '';
  let keepScroll = false;
  let revealEpisode = false;
  switch (action) {
    case 'sort':
      pref.order = pref.order === 'forward' ? 'reverse' : 'forward';
      persist();
      keepScroll = true;
      revealEpisode = true;
      message = `已切换为${orderLabels[pref.order]}`;
      break;
    case 'all': openPage('all'); break;
    case 'sheet': openPage('sheet'); break;
    case 'close': state.page = 'reader'; break;
    case 'reader-back': openPage('all'); break;
    case 'view': state.view = state.view === 'card' ? 'list' : 'card'; break;
    case 'preview':
      if (id === 'sheet') openPage('sheet');
      else { state.view = id; openPage('all'); }
      if (matchMedia('(max-width:600px)').matches) {
        controls.classList.remove('expanded');
        document.querySelector('[data-action="tools"]').setAttribute('aria-expanded', 'false');
        document.querySelector('.device').scrollIntoView({block:'nearest'});
      }
      break;
    case 'episode': keepScroll = state.page === 'sheet'; playEpisode(id); revealEpisode = !keepScroll; break;
    case 'read': playEpisode(sortedIds()[0]); revealEpisode = true; break;
    case 'play':
      if (state.elapsed >= previewSeconds) state.elapsed = 0;
      state.playing = !state.playing; keepScroll = true; break;
    case 'finish': finishEpisode(trigger); return;
    case 'subscribe': pref.subscribed = !pref.subscribed; persist(); keepScroll = true; break;
    case 'collection':
      if (id === state.collection) return;
      state.collection = id;
      state.now = collection().initial;
      state.elapsed = 0;
      state.playing = false;
      state.fromAll = false;
      if (state.page === 'reader') openPage('sheet');
      break;
    case 'edit': pref.edit = pref.edit === 1 ? 2 : 1; persist(); message = `已应用作者改序方案 ${pref.edit}`; break;
    case 'restore': pref.edit = 0; persist(); message = '已恢复发布时间顺序'; break;
    case 'forget': pref.order = 'forward'; persist(); message = '已清除排序记录，恢复默认正序'; break;
    case 'tools':
      const expanded = controls.classList.toggle('expanded');
      trigger.setAttribute('aria-expanded', String(expanded));
      if (expanded) controls.scrollIntoView({block:'start'});
      return;
  }
  render({keepScroll, revealEpisode, trigger});
  if (message) notify(message, action === 'sort');
});
setInterval(() => {
  if (!state.playing) return;
  state.elapsed += 1;
  if (state.elapsed >= previewSeconds) {
    finishEpisode();
    return;
  }
  updateProgress();
}, 1000);
document.querySelector('#brand-icon').innerHTML = icon('layers');
render();
</script>
